route_model: semantic-router
default_route: cheap-router
threshold: 0.55
margin: 0.04
embedding_url: http://host.docker.internal:1234/v1/embeddings
embedding_model: text-embedding-jina-embeddings-v5-text-small-retrieval@q8_0
litellm_base_url: http://litellm:4000
listen_host: 0.0.0.0
listen_port: 4011

pro_hard_rules:
  - PR
  - diff
  - patch
  - review
  - 竞态
  - 死锁
  - 并发
  - 线上
  - 回滚
  - 安全
  - 漏洞
  - token
  - 密钥

routes:
  cheap-router:
    description: 低风险、普通问答、解释、翻译、格式转换、轻量总结
    utterances:
      - 帮我把这段话润色一下
      - 翻译成中文
      - 你好

  pro-router:
    description: 代码、debug、架构、agent、多步推理、高风险判断
    utterances:
      - 帮我分析这个 PR 有没有问题
      - 这个线上 bug 为什么偶发
      - 分析这段代码的竞态条件

  free-probe-router:
    description: 免费端点探活、批量试探、低价值质量比较
    utterances:
      - 批量测试这些免费模型是否可用
      - 探活这些端点
