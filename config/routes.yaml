# Built-in development default. Production deployments should set
# ROUTER_CONFIG to a runtime-owned routes.yaml, normally copied from
# examples/intentmux-home/config/routes.yaml and edited outside the repo.
route_model: auto
fallback_route_id: lite
agent_signal_enabled: true
agent_signal_route_id: deep
agent_signal_min_input_chars: 12000
agent_signal_min_message_count: 6
route_kernel: aurelio
aurelio_router: hybrid
aurelio_hybrid_alpha: 0.3
threshold: 0.4
margin: 0.04
route_bank_path: examples/route_bank.sample.yaml
embedding_url: http://127.0.0.1:1234/v1/embeddings
embedding_model: text-embedding-jina-embeddings-v5-text-small-retrieval@q8_0
embedding_batch_size: 128
route_embedding_cache_enabled: true
litellm_base_url: http://127.0.0.1:4000
litellm_timeout: 120
listen_host: 127.0.0.1
listen_port: 4001

hard_rules:
  - route_id: deep
    keywords:
      - 死锁
      - 内存泄漏
      - 线上事故
      - 生产事故
      - 回滚
      - 数据丢失
      - 数据损坏
      - 漏洞
      - 安全漏洞
      - 安全审计
      - 泄露
      - 泄漏
      - 密钥
      - 凭据
      - bearer token
      - access token
      - refresh token
      - api token
      - API key
      - api key
      - token 泄露
      - token 泄漏
      - 认证漏洞
      - 鉴权绕过
      - 权限绕过
      - 越权
      - recursive delete
      - rm -rf
      - permission bypass

routes:
  lite:
    # Upstream OpenAI-compatible model name for the lite tier.
    # In LiteLLM-first deployments this is usually a LiteLLM model group name.
    target_model: your-lite-model
    description: 低风险、普通问答、解释、翻译、格式转换、轻量总结
    utterances:
      - 什么是 Java File 类
      - 帮我解释一下这段概念
      - 把这段话润色一下
      - 翻译成中文
      - 总结这篇文章
      - 写一个简短说明
      - 这个命令是什么意思
      - 你好
      - 谢谢

  deep:
    # Upstream OpenAI-compatible model name for the deep tier.
    # In LiteLLM-first deployments this is usually a LiteLLM model group name.
    target_model: your-deep-model
    description: 代码、debug、架构、agent、多步推理、高风险判断
    utterances:
      - 帮我分析这个 PR 有没有问题
      - 这个线上 bug 为什么偶发
      - 分析这段代码的竞态条件
      - 设计一个高并发后端架构
      - 这个数据库查询为什么慢
      - 生成可执行修复方案
      - 评估这个技术选型的风险
      - 帮我看这段代码为什么卡死
      - 这个生产改动方案会不会引入数据丢失、权限绕过或回滚风险
