route_model: smart-router
default_route: cheap-router
threshold: 0.55
margin: 0.04
route_bank_path: data/semantic_sets/route_bank.yaml
embedding_url: http://127.0.0.1:1234/v1/embeddings
embedding_model: text-embedding-jina-embeddings-v5-text-small-retrieval@q8_0
litellm_base_url: http://127.0.0.1:4000
listen_host: 127.0.0.1
listen_port: 4001

pro_hard_rules:
  - debug
  - 报错
  - 异常
  - 栈
  - stacktrace
  - traceback
  - PR
  - diff
  - patch
  - review
  - 代码审查
  - 竞态
  - 死锁
  - 并发
  - 锁
  - 线程
  - 内存泄漏
  - 性能瓶颈
  - 数据库性能
  - SQL 优化
  - 索引
  - 事务
  - 一致性
  - 架构
  - 高并发
  - 分布式
  - 部署
  - 线上
  - 回滚
  - 安全
  - 漏洞
  - 泄露
  - token
  - 密钥
  - 认证
  - 鉴权
  - 权限

routes:
  cheap-router:
    description: 低风险、普通问答、解释、翻译、格式转换、轻量总结
    utterances:
      - 什么是 Java File 类
      - 帮我解释一下这段概念
      - 把这段话润色一下
      - 翻译成中文
      - 总结这篇文章
      - 写一个简短说明
      - 这个命令是什么意思
      - 你好
      - 谢谢

  pro-router:
    description: 代码、debug、架构、agent、多步推理、高风险判断
    utterances:
      - 帮我分析这个 PR 有没有问题
      - 这个线上 bug 为什么偶发
      - 分析这段代码的竞态条件
      - 设计一个高并发后端架构
      - 这个数据库查询为什么慢
      - 生成可执行修复方案
      - 评估这个技术选型的风险
      - 帮我看这段代码为什么卡死
      - 这个方案靠谱吗

  free-probe-router:
    description: 免费端点探活、批量试探、低价值质量比较
    utterances:
      - 批量测试这些免费模型是否可用
      - 探活这些端点
      - 跑一组非关键样例看看哪个模型能返回
      - 比较免费模型输出风格
      - 测试模型
      - benchmark
