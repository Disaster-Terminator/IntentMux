# Mature semantic sources used to build route banks.
#
# This file declares source datasets and mapping strategy. Generated banks live
# under data/semantic_sets/ and should keep source names for auditability.
sources:
  - name: massive_zh_cn_train
    kind: remote_tar_jsonl
    url: https://amazon-massive-nlu-dataset.s3.amazonaws.com/amazon-massive-dataset-1.0.tar.gz
    homepage: https://www.amazon.science/code-and-datasets/massive
    license: CC BY 4.0
    license_url: https://github.com/alexa/massive/blob/master/LICENSE
    member: 1.0/data/zh-CN.jsonl
    route: lite
    text_field: utt
    language: zh-CN
    slice: lite_general_zh
    intended_use: route
    ingest_all: true
    limit: 1200
    mappings:
      - field: partition
        include:
          - train

  - name: massive_zh_cn_dev_eval
    kind: remote_tar_jsonl
    url: https://amazon-massive-nlu-dataset.s3.amazonaws.com/amazon-massive-dataset-1.0.tar.gz
    homepage: https://www.amazon.science/code-and-datasets/massive
    license: CC BY 4.0
    license_url: https://github.com/alexa/massive/blob/master/LICENSE
    member: 1.0/data/zh-CN.jsonl
    route: lite
    text_field: utt
    language: zh-CN
    slice: lite_general_zh
    intended_use: eval
    ingest_all: true
    limit: 200
    mappings:
      - field: partition
        include:
          - dev

  - name: massive_zh_cn_test_calibration
    kind: remote_tar_jsonl
    url: https://amazon-massive-nlu-dataset.s3.amazonaws.com/amazon-massive-dataset-1.0.tar.gz
    homepage: https://www.amazon.science/code-and-datasets/massive
    license: CC BY 4.0
    license_url: https://github.com/alexa/massive/blob/master/LICENSE
    member: 1.0/data/zh-CN.jsonl
    route: lite
    text_field: utt
    language: zh-CN
    slice: lite_general_zh
    intended_use: calibration
    ingest_all: true
    limit: 200
    mappings:
      - field: partition
        include:
          - test

  - name: massive_en_us_train
    kind: remote_tar_jsonl
    url: https://amazon-massive-nlu-dataset.s3.amazonaws.com/amazon-massive-dataset-1.0.tar.gz
    homepage: https://www.amazon.science/code-and-datasets/massive
    license: CC BY 4.0
    license_url: https://github.com/alexa/massive/blob/master/LICENSE
    member: 1.0/data/en-US.jsonl
    route: lite
    text_field: utt
    language: en
    slice: lite_general_en
    intended_use: route
    ingest_all: true
    limit: 600
    mappings:
      - field: partition
        include:
          - train

  - name: massive_en_us_dev_eval
    kind: remote_tar_jsonl
    url: https://amazon-massive-nlu-dataset.s3.amazonaws.com/amazon-massive-dataset-1.0.tar.gz
    homepage: https://www.amazon.science/code-and-datasets/massive
    license: CC BY 4.0
    license_url: https://github.com/alexa/massive/blob/master/LICENSE
    member: 1.0/data/en-US.jsonl
    route: lite
    text_field: utt
    language: en
    slice: lite_general_en
    intended_use: eval
    ingest_all: true
    limit: 100
    mappings:
      - field: partition
        include:
          - dev

  - name: massive_en_us_test_calibration
    kind: remote_tar_jsonl
    url: https://amazon-massive-nlu-dataset.s3.amazonaws.com/amazon-massive-dataset-1.0.tar.gz
    homepage: https://www.amazon.science/code-and-datasets/massive
    license: CC BY 4.0
    license_url: https://github.com/alexa/massive/blob/master/LICENSE
    member: 1.0/data/en-US.jsonl
    route: lite
    text_field: utt
    language: en
    slice: lite_general_en
    intended_use: calibration
    ingest_all: true
    limit: 100
    mappings:
      - field: partition
        include:
          - test

  - name: curated_zh_cn_deep
    kind: curated_yaml
    path: data/source_samples/default_zh_cn_deep.example.yaml
    homepage: https://github.com/Disaster-Terminator/IntentMux
    license: Apache-2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    route: deep
    text_field: text
    language: zh-CN
    slice: deep_debug_zh
    intended_use: route
    limit: 100

  - name: swebench_issue_resolution
    kind: huggingface
    dataset: princeton-nlp/SWE-bench
    homepage: https://github.com/SWE-bench/SWE-bench
    license: MIT
    license_url: https://github.com/SWE-bench/SWE-bench/blob/main/LICENSE.md
    split: test
    route: deep
    text_field: problem_statement
    language: en
    slice: deep_debug_issue
    intended_use: route
    ingest_all: true
    limit: 1200

  - name: swebench_dev_eval
    kind: huggingface
    dataset: princeton-nlp/SWE-bench
    homepage: https://github.com/SWE-bench/SWE-bench
    license: MIT
    license_url: https://github.com/SWE-bench/SWE-bench/blob/main/LICENSE.md
    split: dev
    route: deep
    text_field: problem_statement
    language: en
    slice: deep_debug_issue
    intended_use: eval
    ingest_all: true
    limit: 200

  - name: swebench_train_calibration
    kind: huggingface
    dataset: princeton-nlp/SWE-bench
    homepage: https://github.com/SWE-bench/SWE-bench
    license: MIT
    license_url: https://github.com/SWE-bench/SWE-bench/blob/main/LICENSE.md
    split: train
    route: deep
    text_field: problem_statement
    language: en
    slice: deep_debug_issue
    intended_use: calibration
    ingest_all: true
    limit: 200

  - name: mbpp_codegen
    kind: huggingface
    dataset: mbpp
    homepage: https://github.com/google-research/google-research/tree/master/mbpp
    license: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    split: test
    route: deep
    text_field: text
    language: en
    slice: deep_code_generation
    intended_use: route
    ingest_all: true
    limit: 500

  - name: mbpp_validation_eval
    kind: huggingface
    dataset: mbpp
    homepage: https://github.com/google-research/google-research/tree/master/mbpp
    license: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    split: validation
    route: deep
    text_field: text
    language: en
    slice: deep_code_generation
    intended_use: eval
    ingest_all: true
    limit: 90

  - name: mbpp_train_calibration
    kind: huggingface
    dataset: mbpp
    homepage: https://github.com/google-research/google-research/tree/master/mbpp
    license: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    split: train
    route: deep
    text_field: text
    language: en
    slice: deep_code_generation
    intended_use: calibration
    ingest_all: true
    limit: 100

  - name: humaneval_codegen
    kind: huggingface
    dataset: openai/openai_humaneval
    homepage: https://github.com/openai/human-eval
    license: MIT
    license_url: https://github.com/openai/human-eval/blob/master/LICENSE
    split: test
    route: deep
    text_field: prompt
    language: en
    slice: deep_code_generation
    intended_use: route
    ingest_all: true
    limit: 164
