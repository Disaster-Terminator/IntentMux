[project]
name = "gateway-semantic-router"
version = "0.1.0"
description = "Lightweight Chinese OpenAI-compatible routing sidecar for the local LiteLLM gateway."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

