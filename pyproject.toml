[project]
name = "intentmux"
version = "0.1.0"
description = "Lightweight, auditable intent-routing sidecar for LiteLLM and OpenAI-compatible gateways."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "semantic-router>=0.1.15",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.13",
]
assets = [
    "datasets>=2.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"scripts/build_semantic_assets.py" = ["E402"]
"scripts/eval_routes.py" = ["E402"]
"scripts/replay_routes.py" = ["E402"]
"scripts/select_review_candidates.py" = ["E402"]
"scripts/verify_route_contract.py" = ["E402"]

[tool.setuptools.packages.find]
include = ["router*"]
