name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run unit tests
        run: |
          set -o pipefail
          mkdir -p ci-logs
          uv run python -m pytest -q 2>&1 | tee ci-logs/pytest.log

      - name: Run mock route evaluation
        run: |
          set -o pipefail
          mkdir -p ci-logs
          uv run python scripts/eval_routes.py --mock-embeddings 2>&1 | tee ci-logs/mock-eval.log

      - name: Upload CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: ci-logs/
          if-no-files-found: ignore
